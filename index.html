    <${Cd}><${Hd} r="L3+">🥶 FROZEN TUNDRA</${Hd}><div style=${{padding:"8px 14px"}}>${cold.length===0?html`<div className="lbl" style=${{fontSize:12,color:GY,padding:6}}>No active 3+ losing streaks.</div>`:cold.slice(0,6).map(function(x){return html`<div key=${x.t} style=${{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid #EEF2EB",fontSize:13,gap:8}}><${Tm} name=${x.t} elim=${isElim(x.t)}></${Tm}><span style=${{display:"flex",gap:6,alignItems:"center"}}><span className="lbl mgr-line" style=${{fontSize:9,color:lightName(x.m,O),fontWeight:700}}><${Crest} name=${x.m} sz=${14} />${x.m}</span><${Stk} v=${x.v.stk}></${Stk}></span></div>`})}</div></${Cd}>
   </div>

   <${Cd} s=${{marginBottom:16}}><${Hd} r="DRAG TO ADJUST">WHAT-IF · PROJECTED FINAL WINS</${Hd}><div style=${{padding:"14px 16px"}}>
    <div className="lbl" style=${{fontSize:12,color:GY,marginBottom:12,lineHeight:1.45}}>Current pace over a full 136-game slate (8 teams × 17). Slide to add or subtract wins and see how the race shakes out.</div>
    ${[].concat(mgrs).sort(function(a,b){return b.proj-a.proj}).map(function(m,i){var mx=Math.max.apply(null,mgrs.map(function(z){return z.proj}))||1;return html`<div key=${m.name} style=${{marginBottom:12}}>
     <div style=${{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span className="lbl mgr-line" style=${{fontWeight:700,color:lightName(m.name,N),fontSize:11}}>${i===0?"👑 ":""}<${Crest} name=${m.name} sz=${16} />${m.name}</span><span style=${Object.assign({fontWeight:900,color:i===0?O:N,fontSize:14},serif)}>${m.proj}</span></div>
     <div style=${{background:"#E4ECE1",borderRadius:6,height:6,marginBottom:6}}><div style=${{width:Math.max(0,m.proj/mx*100)+"%",height:"100%",borderRadius:6,background:i===0?O:"#4B6B57"}}></div></div>
     <input type="range" min="-15" max="15" value=${boost[m.name]||0} aria-label=${"Adjust "+m.name} onChange=${function(e){var v=+e.target.value;setBoost(function(b){var n=Object.assign({},b);n[m.name]=v;return n})}} style=${{width:"100%",accentColor:O}} />
    </div>`})}
    <button className="reset-btn" onClick=${function(){setBoost({})}}>RESET</button>
   </div></${Cd}>

   <${Cd} s=${{marginBottom:16}}><${Hd} r="$75 POT">SUPER BOWL LXI CHAMPION</${Hd}><div style=${{padding:"12px 16px"}}>
    <div className="lbl" style=${{fontSize:12,color:GY,marginBottom:10,lineHeight:1.45}}>Own the champ - take the pot. Each manager's top contender by wins:</div>
    ${ranked.map(function(m){var top=[].concat(m.teams).sort(function(a,b){return rec(b).w-rec(a).w||gp(a)-gp(b)})[0];var v=rec(top);return html`<div key=${m.name} style=${{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid #EEF2EB",fontSize:13,gap:8}}>
     <span className="mgr-line" style=${{fontWeight:700,color:lightName(m.name,N),minWidth:88}}><${Crest} name=${m.name} sz=${16} />${m.name}</span><${Tm} name=${top} elim=${isElim(top)}></${Tm}><span style=${Object.assign({fontWeight:900,fontSize:14,color:N},serif)}>${v.w} <span className="lbl" style=${{fontSize:9,color:GY,fontFamily:"inherit"}}>WINS</span></span>
    </div>`})}
   </div></${Cd}>
  </div>`:null}

  ${tab==="rosters"?html`<div className="rosters" style=${{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(250px,1fr))",gap:12,animation:"fadeIn .25s"}}>
   ${ranked.map(function(m,mi){var srt=[].concat(m.teams).sort(function(a,b){return rec(b).w-rec(a).w});return html`<${Cd} key=${m.name}>
    <div style=${{background:mi===0?O:N,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
     <span className="mgr-line" style=${{color:"#fff",fontWeight:700,fontSize:13}}><${Crest} name=${m.name} sz=${18} />${m.name} <span className="lbl" style=${{fontSize:9,opacity:.7}}>· Pick ${PICK[m.name]}</span></span>
     <span style=${Object.assign({color:"#fff",fontWeight:900,fontSize:18},serif)}>${m.tw}</span>
    </div>
    <table style=${{width:"100%"}}><thead><tr style=${{background:LN}}>${["TEAM","WINS","W-L-T","STK"].map(function(x){return html`<th key=${x} className="lbl" style=${{padding:"6px 8px",fontSize:8,fontWeight:700,color:N,textAlign:x==="TEAM"?"left":"center"}}>${x}</th>`})}</tr></thead>
    <tbody>${srt.map(function(t){var v=rec(t);return html`<tr key=${t} style=${{borderTop:"1px solid #EEF2EB"}}>
     <td style=${{padding:"7px 8px",fontSize:13}}><${Tm} name=${t} elim=${isElim(t)}></${Tm}></td>
     <td style=${Object.assign({padding:"7px 8px",fontSize:14,textAlign:"center",fontWeight:900,color:N},serif)}>${v.w}</td>
     <td style=${{padding:"7px 8px",fontSize:12,textAlign:"center",color:GY}}>${wlt(v)}</td>
     <td style=${{padding:"7px 8px",textAlign:"center"}}><${Stk} v=${v.stk}></${Stk}></td>
    </tr>`})}</tbody></table>
   </${Cd}>`})}
  </div>`:null}

  ${tab==="draft"?html`<div style=${{animation:"fadeIn .25s"}}><${Cd}>
   <${Hd} r="LOCKED · SNAKE · 8 RDS">${SEASON} DRAFT · ${DRAFT_DATE.toUpperCase()}</${Hd}>
   <div className="draft-scroll"><table className="dt" style=${{width:"100%",minWidth:460}}><thead><tr style=${{background:LN}}>
    <th className="lbl" style=${{padding:"8px",fontSize:8,width:34,color:N}}>RD</th>
    ${order.map(function(m){return html`<th key=${m} className="lbl" style=${{padding:"8px",fontSize:9,fontWeight:800,color:lightName(m,N),textAlign:"left"}}><span className="mgr-line"><${Crest} name=${m} sz=${16} />${m}</span> <span style=${{color:GY,fontWeight:600}}>#${PICK[m]}</span></th>`})}
   </tr></thead><tbody>
    ${rounds.map(function(row,ri){return html`<tr key=${ri} style=${{borderTop:"1px solid #EEF2EB",background:ri%2?"#FAFBF8":"#fff"}}>
     <td style=${{padding:"8px",textAlign:"center",fontWeight:800,fontSize:12,color:O}}>${ri+1}${ri%2===0?"→":"←"}</td>
     ${row.map(function(c){var v=rec(c.t);return html`<td key=${c.m} style=${{padding:"8px",fontSize:12}}><div style=${{display:"flex",alignItems:"center",justifyContent:"space-between",gap:4}}><span><span className="lbl" style=${{fontSize:8,color:GY,marginRight:4}}>${c.pick}</span><${Tm} name=${c.t} sz=${14} elim=${isElim(c.t)}></${Tm}></span><span className="lbl" style=${{fontSize:9,color:GY,fontWeight:700}}>${v.w}W</span></div></td>`})}
    </tr>`})}
   </tbody></table></div>
   <div className="draft-cards">
    ${rounds.map(function(row,ri){return html`<section className="draft-round" key=${"c"+ri}>
     <h3>ROUND ${ri+1} ${ri%2===0?"→":"←"}</h3>
     <div className="draft-grid">
      ${row.map(function(c){var v=rec(c.t);return html`<div className="draft-pick" key=${c.m}>
       <div className="meta"><span className="mgr-line" style=${{color:lightName(c.m,"#0E3B22")}}><${Crest} name=${c.m} sz=${16} />${c.m}</span><span>#${c.pick}</span></div>
       <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",gap:6}}>
        <${Tm} name=${c.t} sz=${16} elim=${isElim(c.t)}></${Tm}>
        <span style=${{fontWeight:800,color:GY,fontSize:12}}>${v.w}W</span>
       </div>
      </div>`})}
     </div>
    </section>`})}
   </div>
  </${Cd}></div>`:null}

  ${tab==="nfl"?html`<div style=${{animation:"fadeIn .25s"}}>
   <div className="divs" style=${{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
    ${DIVS.map(function(d){var srt=[].concat(d.teams).sort(function(a,b){var A=rec(a),B=rec(b);return B.w-A.w||gp(a)-gp(b)});return html`<${Cd} key=${d.name}>
     <${Hd} r=${d.conf}>${d.name.toUpperCase()}</${Hd}>
     <div className="nfl-d"><table style=${{width:"100%"}}><thead><tr style=${{background:LN}}>${["TEAM","MGR","GP","W","L","T","DIFF"].map(function(x){return html`<th key=${x} className="lbl" style=${{padding:"6px",fontSize:8,fontWeight:700,color:N,textAlign:x==="TEAM"||x==="MGR"?"left":"center"}}>${x}</th>`})}</tr></thead>
     <tbody>${srt.map(function(t,i){var v=rec(t),df=v.pf-v.pa;return html`<tr key=${t} style=${{borderTop:i===1?"2px dashed #B9C8B3":"1px solid #EEF2EB",background:i===0?LO:"#fff"}}>
      <td style=${{padding:"6px",fontSize:12}}><${Tm} name=${t} sz=${14} elim=${isElim(t)}></${Tm}></td>
      <td className="lbl" style=${{padding:"6px",fontSize:9,color:lightName(getOwner(t),O),fontWeight:700}}><span className="mgr-line"><${Crest} name=${getOwner(t)} sz=${14} />${getOwner(t)}</span></td>
      <td style=${{padding:"6px",fontSize:12,textAlign:"center"}}>${gp(t)}</td>
      <td style=${{padding:"6px",fontSize:12,textAlign:"center",fontWeight:800}}>${v.w}</td>
      <td style=${{padding:"6px",fontSize:12,textAlign:"center"}}>${v.l}</td>
      <td style=${{padding:"6px",fontSize:12,textAlign:"center"}}>${v.t}</td>
      <td style=${{padding:"6px",fontSize:12,textAlign:"center",color:df>=0?GR:RD}}>${df>0?"+":""}${df}</td>
     </tr>`})}</tbody></table></div>
     <div className="nfl-m">${srt.map(function(t,i){var v=rec(t),df=v.pf-v.pa;return html`<div key=${t} className="nfl-row" style=${{borderTop:i===1?"2px dashed #B9C8B3":"1px solid #EEF2EB",background:i===0?LO:"#fff"}}>
      <div style=${{display:"flex",justifyContent:"space-between",gap:8,alignItems:"center"}}>
       <${Tm} name=${t} sz=${16} elim=${isElim(t)}></${Tm}>
       <span style=${{fontWeight:800,fontSize:13}}>${wlt(v)}</span>
      </div>
      <div className="lbl" style=${{display:"flex",justifyContent:"space-between",marginTop:4,fontSize:12,fontWeight:700}}>
       <span className="mgr-line" style=${{color:lightName(getOwner(t),O)}}><${Crest} name=${getOwner(t)} sz=${14} />${getOwner(t)}</span>
       <span>GP ${gp(t)}</span>
       <span style=${{color:df>=0?GR:RD}}>${df>0?"+":""}${df}</span>
      </div>
     </div>`})}</div>
    </${Cd}>`})}
   </div>
   <div className="lbl" style=${{fontSize:9,color:GY,marginTop:8}}>Sorted by wins. Shaded row above the dashed line = division leader.</div>
  </div>`:null}

  ${tab==="history"?html`<div style=${{animation:"fadeIn .25s"}}>
   <div className="prizes" style=${{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
    <div style=${{flex:1,minWidth:160,background:LO,borderRadius:8,padding:"14px",border:"1px solid #E9D3BC"}}>
     <div className="lbl" style=${{fontSize:8,color:O,fontWeight:700,letterSpacing:1}}>2025 REGULAR SEASON CHAMPION</div>
     <div style=${Object.assign({fontSize:24,fontWeight:900,color:N},serif)}>🏆 Rippe</div>
     <div className="lbl" style=${{fontSize:10,color:GY}}>83 wins · won by 11 · $150</div>
    </div>
    <div style=${{flex:1,minWidth:160,background:"#ECF7EE",borderRadius:8,padding:"14px",border:"1px solid #BBE0C3"}}>
     <div className="lbl" style=${{fontSize:8,color:GR,fontWeight:700,letterSpacing:1}}>SUPER BOWL LX SIDE BET</div>
     <div style=${Object.assign({fontSize:24,fontWeight:900,color:N},serif)}>🏈 Rippe</div>
     <div className="lbl" style=${{fontSize:10,color:GY,display:"flex",alignItems:"center",gap:4}}><${Tm} name="Seahawks" sz=${14} elim=${false}></${Tm}> Super Bowl LX champions · $75</div>
    </div>
   </div>
   <${Cd} s=${{marginBottom:16}}><${Hd} r="FINAL · RIPPE SWEPT BOTH POTS">2025 FINAL STANDINGS</${Hd}>
    ${HIST.mgrs.map(function(m,i){return html`<div key=${m.name} style=${{padding:"12px 16px",borderTop:i?"1px solid #EEF2EB":"none",background:i===0?LO:"#fff"}}>
     <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6,gap:8}}>
      <span className="mgr-line" style=${Object.assign({fontWeight:900,fontSize:15,color:lightName(m.name,N)},serif)}>${i+1}. <${Crest} name=${m.name} sz=${18} />${m.name}</span>
      <span style=${Object.assign({fontWeight:900,fontSize:18,color:i===0?O:N},serif)}>${m.tw} <span className="lbl" style=${{fontSize:10,color:GY,fontFamily:"inherit"}}>${i===0?"":"(-"+(HIST.mgrs[0].tw-m.tw)+")"}</span></span>
     </div>
     <div style=${{display:"flex",flexWrap:"wrap",gap:"4px 12px"}}>${m.teams.map(function(t){return html`<span key=${t[0]} className="lbl" style=${{fontSize:10}}><${Tm} name=${t[0]} sz=${12} elim=${false}></${Tm}> <b>${t[1]}</b></span>`})}</div>
    </div>`})}
   </${Cd}>
  </div>`:null}

  ${tab==="rules"?html`<div style=${{animation:"fadeIn .25s"}}><${Cd} s=${{marginBottom:16}}><${Hd}>OFFICIAL RULES</${Hd}><div style=${{padding:"16px"}}>
   <div style=${Object.assign({fontSize:14,fontWeight:900,color:N,marginBottom:12},serif)}>WINS ARE ALL THAT MATTER</div>
   ${[["THE GAME","4 managers draft 8 NFL teams each. Most combined regular season wins across all 8 teams wins the league."],["DRAFT","Snake format, 8 rounds, all 32 NFL teams. Held "+DRAFT_DATE+". Order: Swaggy, G$, Gainzy, Rippe."],["SCORING","Every regular season win counts as 1. Losses and ties count for nothing. Playoff games don't count toward the league."],["TIEBREAKER","If tied on total wins, the manager whose single best team has the most wins takes it."],["REG SEASON POT","$50 buy-in. Most wins at the end of Week 18 takes $150."],["SUPER BOWL SIDE BET","$25 buy-in. Own the champ - take the pot. The manager who drafted the Super Bowl LXI champion takes $75."]].map(function(x){return html`<div key=${x[0]} style=${{marginBottom:12}}><div className="lbl" style=${{fontSize:9,fontWeight:800,color:O,letterSpacing:1}}>${x[0]}</div><div style=${{fontSize:13,color:N,lineHeight:1.5}}>${x[1]}</div></div>`})}
  </div></${Cd}></div>`:null}
 </div>
 <div className="lbl" style=${{textAlign:"center",padding:"10px 12px 14px",fontSize:12,color:GY}}>NFL Team League ${SEASON} · Defending Champ: <span style=${{color:"#6B4FB3"}}>Rippe</span> · Super Bowl: <span style=${{color:"#6B4FB3"}}>Rippe</span> (Seahawks)</div>
 </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
